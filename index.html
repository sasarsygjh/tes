<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lajur Evakuasi Tsunami — Dashboard</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>

  <style>
  /* ==========================================================
     TOKEN DESAIN — satu warna solid per peran, tanpa gradasi.
     Ganti nilai di sini untuk menyesuaikan identitas instansi.
     ========================================================== */
:root{
  --bar:#ffb24d;           /* oren terang — latar panel atas */
  --bar-ink:#3a2408;        /* teks gelap, kontras di atas oren terang */
  --bar-ink-dim:#8a5a1f;    /* teks sekunder */
  --bar-line:#f0a030;       /* garis pembatas, sedikit lebih gelap dari --bar */

  --surface:#ffffff;
  --surface-2:#f3f5f6;
  --ink:#30281b;
  --ink-dim:#5b6670;
  --line:#d8dee3;

  --accent:#e8720c;         /* oren tua solid — dipakai di semua tombol utama */
  --ok:#1a8754;             /* tetap hijau khusus tombol Google Maps */
  --warn:#b3690a;
  --danger:#b3362b;         /* tetap merah khusus zona rawan */

  --radius:4px;
}

  *{ box-sizing:border-box; }
  html, body{ margin:0; height:100%; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); }

  /* ==========================================================
     PANEL ATAS (horizontal dashboard bar)
     ========================================================== */
  .topbar{
    height:56px; flex:0 0 56px; background:var(--bar); color:var(--bar-ink);
    display:flex; align-items:stretch; border-bottom:1px solid var(--bar-line);
  }

  .topbar-brand{
    display:flex; align-items:center; gap:12px; padding:0 18px;
    border-right:1px solid var(--bar-line); flex:0 0 auto;
  }
  .logo-box{
    width:34px; height:34px; border:1px dashed var(--bar-ink-dim); border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-size:9px; color:var(--bar-ink-dim); letter-spacing:.05em; flex:0 0 auto;
  }
  .brand-text h1{ font-size:14.5px; font-weight:700; margin:0; letter-spacing:-.01em; }
  .brand-text span{ font-size:11px; color:var(--bar-ink-dim); display:block; margin-top:1px; }

  .topbar-nav{ display:flex; align-items:stretch; flex:0 0 auto; }
  .nav-tab{
    background:none; border:none; color:var(--bar-ink-dim); font-size:13px; font-weight:600;
    padding:0 18px; cursor:pointer; border-bottom:2px solid transparent; font-family:inherit;
  }
  .nav-tab:hover{ color:var(--bar-ink); }
  .nav-tab.aktif{ color:var(--bar-ink); border-bottom-color:var(--accent); }

  .topbar-region{
    display:flex; flex-direction:column; justify-content:center; padding:0 18px;
    border-left:1px solid var(--bar-line); flex:0 0 auto;
  }
  .topbar-region b{ font-size:12px; }
  .topbar-region span{ font-size:11px; color:var(--bar-ink-dim); }

  .topbar-spacer{ flex:1; }

  .topbar-basemap{ display:flex; align-items:center; gap:0; padding-right:18px; }
  .bm-btn{
    background:none; border:1px solid var(--bar-line); color:var(--bar-ink-dim);
    font-size:12px; font-weight:600; padding:7px 14px; cursor:pointer; font-family:inherit;
  }
  .bm-btn:first-child{ border-radius:var(--radius) 0 0 var(--radius); border-right:none; }
  .bm-btn:last-child{ border-radius:0 var(--radius) var(--radius) 0; }
  .bm-btn.aktif{ background:var(--accent); border-color:var(--accent); color:#fff; }

  /* ==========================================================
     LAYOUT UTAMA
     ========================================================== */
  .shell{ display:flex; height:calc(100% - 56px); }
  #map{ flex:1; min-width:0; position:relative; background:#0d1a24; }

  aside{
    width:320px; flex:0 0 320px; background:var(--surface);
    border-left:1px solid var(--line); overflow-y:auto;
  }
  .pane{ padding:16px 18px; border-bottom:1px solid var(--line); }
  .pane h2{
    font-size:11px; text-transform:uppercase; letter-spacing:.07em;
    color:var(--ink-dim); margin:0 0 10px; font-weight:700;
  }

  .search{
    width:100%; padding:9px 11px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--surface-2); font-size:13.5px; color:var(--ink);
  }
  .search:focus{ outline:none; border-color:var(--accent); }

  .toggle{ display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13.5px; cursor:pointer; }
  .toggle input{ width:15px; height:15px; cursor:pointer; accent-color:var(--accent); }
  .dot{ width:11px; height:11px; border-radius:2px; flex:0 0 auto; }

  .btn{
    width:100%; padding:10px; margin-top:8px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--surface-2); color:var(--ink);
    font-size:13.5px; font-weight:600; cursor:pointer; font-family:inherit;
  }
  .btn.primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn:hover{ filter:brightness(0.97); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  a.btn{ display:block; text-align:center; text-decoration:none; }
  .btn.gmaps{ background:var(--ok); color:#fff; border-color:var(--ok); }
  .btn.aktif-mode{ background:#fdf0da; border-color:var(--warn); color:var(--warn); }

  .list-wrap{ padding:12px 18px; }
  .card{
    border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
    margin-bottom:9px; cursor:pointer; background:var(--surface);
  }
  .card:hover{ border-color:var(--accent); }
  .card img{ width:100%; height:100px; object-fit:cover; display:block; background:var(--surface-2); }
  .card .isi{ padding:11px; }
  .card b{ display:block; font-size:13.5px; margin-bottom:4px; }
  .meta{ font-size:11.5px; color:var(--ink-dim); display:flex; gap:12px; }

  .popup-foto{ width:220px; height:120px; object-fit:cover; border-radius:3px; display:block; margin-bottom:8px; }

  .legenda-jalur-row{
    display:flex; align-items:center; gap:9px; padding:8px; font-size:12.5px;
    cursor:pointer; border-radius:var(--radius); border:1px solid transparent;
  }
  .legenda-jalur-row:hover{ background:var(--surface-2); }
  .legenda-jalur-row.aktif{ background:#eaf2f8; border-color:var(--accent); }
  .legenda-jalur-garis{ width:26px; height:5px; border-radius:2px; flex:0 0 auto; }
  .legenda-jalur-teks b{ font-weight:700; }
  .legenda-jalur-teks span{ color:var(--ink-dim); font-size:11.5px; }

  .hasil-rute{
    margin-top:12px; padding:11px; border-radius:var(--radius);
    background:var(--surface-2); border:1px solid var(--line); font-size:12.5px; line-height:1.5;
  }
  .hasil-rute:empty{ display:none; }
  .hasil-rute .catatan{ color:var(--warn); font-size:11.5px; margin-top:6px; }
  .gmaps-link{ font-size:11.5px; color:var(--ok); font-weight:600; text-decoration:none; }
  .gmaps-link:hover{ text-decoration:underline; }

  /* ==========================================================
     ELEMEN KARTOGRAFI DI ATAS PETA — flat, tanpa bayangan berlebih
     ========================================================== */
  .peta-overlay{
    position:absolute; background:rgba(22,34,46,.92); color:#eef2f5;
    border:1px solid var(--bar-line); font-family:'SF Mono',Menlo,Consolas,monospace;
    font-size:11px; padding:6px 10px; z-index:650; letter-spacing:.01em;
  }
  #koordinat{ left:12px; bottom:12px; }

  .north-arrow{
    background:var(--surface); border:1px solid var(--line); width:34px; height:34px;
    display:flex; align-items:center; justify-content:center; border-radius:var(--radius);
  }

  .leaflet-bar a{ background:var(--surface); color:var(--ink); border-color:var(--line) !important; border-radius:0 !important; }
  .leaflet-bar a:hover{ background:var(--surface-2); }
  .leaflet-control-scale-line{
    background:rgba(255,255,255,.88); border:2px solid var(--ink) !important;
    border-top:none !important; color:var(--ink); font-size:11px;
  }

  /* ========== BARU: label nama wilayah di atas peta ========== */
  .label-wilayah{
    background:none; border:none; box-shadow:none;
    font-size:11px; font-weight:700; color:#2a2a2a;
    text-shadow:0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
  }
  </style>
</head>
<body style="display:flex;flex-direction:column;height:100%">

<!-- ==========================================================
     PANEL ATAS — judul, navigasi, info wilayah, basemap
     ========================================================== -->
<header class="topbar">
  <div class="topbar-brand">
    <img src="images/logo.png" alt="Logo" style="height:32px;width:auto;">
    <div class="brand-text">
      <h1>WebGIS Evakuasi Tsunami</h1>
      <span>Informasi Jalur &amp; Shelter Evakuasi</span>
    </div>
  </div>

  <nav class="topbar-nav">
    <button class="nav-tab aktif" data-target="map">Peta</button>
    <button class="nav-tab" data-target="paneAksi">Shelter &amp; Rute</button>
    <button class="nav-tab" data-target="paneJalur">Jalur Evakuasi</button>
  </nav>

  <div class="topbar-region">
    <b>Desa Sidodadi</b>
    <span>Kec. Teluk Pandan, Kab. Pesawaran</span>
  </div>

  <div class="topbar-spacer"></div>

  <div class="topbar-basemap">
    <button class="bm-btn" id="baseJalan">Peta Jalan</button>
    <button class="bm-btn aktif" id="baseSatelit">Citra Satelit</button>
  </div>
</header>

<div class="shell">

  <div id="map">
    <div class="peta-overlay" id="koordinat">-- , --  ·  zoom --</div>
  </div>

  <aside>
    <div class="pane">
      <h2>Cari Shelter</h2>
      <input class="search" id="search" placeholder="Ketik nama shelter atau kelurahan…">
    </div>

    <div class="pane">
      <h2>Layer Peta</h2>
      <label class="toggle"><input type="checkbox" id="lyrShelter" checked>
        <span class="dot" style="background:#0a7d52"></span> Titik Shelter</label>
      <label class="toggle"><input type="checkbox" id="lyrRoute" checked>
        <span class="dot" style="background:#d9721e"></span> Jalur Evakuasi</label>
      <label class="toggle"><input type="checkbox" id="lyrHazard" checked>
        <span class="dot" style="background:#b3362b"></span> Zona Rawan</label>
      <!-- ========== BARU: toggle batas wilayah ========== -->
      <label class="toggle"><input type="checkbox" id="lyrBatas" checked>
        <span class="dot" style="background:#FF0000"></span> Batas Wilayah</label>
    </div>

    <div class="pane" id="paneJalur">
      <h2>Keterangan Jalur Evakuasi</h2>
      <p style="font-size:11px;color:var(--ink-dim);margin-top:-4px">Klik salah satu untuk fokus ke jalurnya di peta</p>
      <div id="legendaJalur">
        <p style="font-size:12px;color:var(--ink-dim)">Memuat data jalur…</p>
      </div>
    </div>

    <div class="pane" id="paneAksi">
      <h2>Aksi</h2>
      <button class="btn primary" id="geoBtn">Deteksi Lokasi Saya</button>
      <button class="btn" id="manualBtn">Atur Posisi Manual (klik peta)</button>
      <button class="btn" id="nearBtn">Cari Shelter Terdekat</button>
      <div class="hasil-rute" id="hasilRute"></div>
    </div>

    <div class="list-wrap" id="list"></div>
  </aside>

</div>

<script>
  // ==========================================================
  // 1-2. Peta & basemap — Citra Satelit sebagai tampilan default
  // ==========================================================
  const map = L.map('map', { zoomControl:false }).setView([-5.553828878, 105.236167686], 14);
  L.control.zoom({ position:'topright' }).addTo(map);

  const basemapJalan = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  });
  const basemapSatelit = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom: 19, attribution: 'Tiles &copy; Esri, Maxar, Earthstar Geographics' }
  );
  basemapSatelit.addTo(map);

  const baseJalanBtn   = document.getElementById('baseJalan');
  const baseSatelitBtn = document.getElementById('baseSatelit');

  baseJalanBtn.addEventListener('click', () => {
    map.removeLayer(basemapSatelit); map.addLayer(basemapJalan);
    baseJalanBtn.classList.add('aktif'); baseSatelitBtn.classList.remove('aktif');
  });
  baseSatelitBtn.addEventListener('click', () => {
    map.removeLayer(basemapJalan); map.addLayer(basemapSatelit);
    baseSatelitBtn.classList.add('aktif'); baseJalanBtn.classList.remove('aktif');
  });

  L.control.scale({ position:'bottomright', metric:true, imperial:false }).addTo(map);

  const northArrow = L.control({ position:'topright' });
  northArrow.onAdd = function () {
    const div = L.DomUtil.create('div', 'north-arrow');
    div.innerHTML = '<svg width="16" height="20" viewBox="0 0 16 20"><path d="M8 0L14 20L8 15L2 20Z" fill="#1b2430"/></svg>';
    div.title = 'Utara';
    return div;
  };
  northArrow.addTo(map);

  const koordEl = document.getElementById('koordinat');
  map.on('mousemove', e => {
    koordEl.textContent = e.latlng.lat.toFixed(5) + ', ' + e.latlng.lng.toFixed(5) + '  ·  zoom ' + map.getZoom();
  });
  map.on('zoomend', () => {
    const c = map.getCenter();
    koordEl.textContent = c.lat.toFixed(5) + ', ' + c.lng.toFixed(5) + '  ·  zoom ' + map.getZoom();
  });

  document.querySelectorAll('.nav-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('aktif'));
      tab.classList.add('aktif');
      const target = tab.dataset.target;
      if (target === 'map') { map.flyTo([-5.553828878, 105.236167686], 14, { duration:.6 }); }
      else { document.getElementById(target).scrollIntoView({ behavior:'smooth', block:'start' }); }
    });
  });

  // Dipakai bersama oleh beberapa layer (jalur, batas wilayah, dll) untuk
  // membaca atribut tanpa peduli huruf besar/kecil pada nama kolom
  function ambilAtribut(props, namaKolom) {
    if (!props) return undefined;
    const kunci = Object.keys(props).find(k => k.toLowerCase() === namaKolom.toLowerCase());
    return kunci !== undefined ? props[kunci] : undefined;
  }


  // ==========================================================
  // 3-4. Shelter dari GeoJSON, dengan foto
  // ==========================================================
  const layerShelter = L.layerGroup().addTo(map);
  const markerByName = {};
  let shelterFeatures = [];
  let shelterSiap = false, jalurSiap = false;

  fetch('data/shelter.geojson')
    .then(res => res.json())
    .then(data => {
      shelterFeatures = data.features;
      L.geoJSON(data, {
        onEachFeature: function (feature, layer) {
          const p = feature.properties;
          const fotoHtml = p.foto
            ? `<img class="popup-foto" src="${p.foto}" alt="${p.nama}" onerror="this.style.display='none'">`
            : '';
          const [sLng, sLat] = feature.geometry.coordinates;
          layer.bindPopup(function () {
            return fotoHtml +
              '<b>' + p.nama + '</b><br>' +
              'Kapasitas: ' + p.kapasitas + ' jiwa<br>' +
              'Elevasi: ' + (p.elevasi ?? '-') + ' mdpl<br>' +
              '<a class="gmaps-link" href="' + urlGoogleMaps(posisiUser(), { lat: sLat, lng: sLng }) +
              '" target="_blank" rel="noopener">Navigasi di Google Maps</a>';
          });
          markerByName[p.nama] = layer;
        }
      }).addTo(layerShelter);
      renderList();
      shelterSiap = true;
      cobaSambungkanJalurKeShelter();
    })
    .catch(err => console.error('Gagal memuat data shelter:', err));


  // ==========================================================
  // 5-6. Jalur evakuasi (SHP), dengan keterangan interaktif
  // ==========================================================
  const layerJalur = L.layerGroup().addTo(map);

  const paletJalur = [
    '#2a7fc9', '#7fc7e8', '#e67ac4', '#9bd97a',
    '#f0c04a', '#b896e0', '#5fbf8a', '#8fe0d8', '#e8a0c4'
  ];
  const BERAT_NORMAL = 5;
  const BERAT_AKTIF  = 9;

  const FILE_JALUR        = 'data/jalur_SDD.zip';
  const KOLOM_NAMA_JALUR  = 'Id';
  const KOLOM_JARAK_KM    = 'JARAK_KM';
  const KOLOM_WAKTU       = 'Waktu';

  const layerPerNamaJalur = {};
  const ujungPerNamaJalur = {};
  const sambungPerNama = {};
  let warnaPerNamaGlobal = {};

  const MIN_SAMBUNG_M = 3;
  const MAKS_SAMBUNG_M = 1000;
  const TAMPILKAN_SAMBUNGAN_SHP = true;

  function ambilUjung(geom) {
    if (!geom) return [];
    const garis = geom.type === 'LineString' ? [geom.coordinates]
                : geom.type === 'MultiLineString' ? geom.coordinates : [];
    const hasil = [];
    garis.forEach(g => {
      if (g.length) {
        hasil.push([g[0][1], g[0][0]]);
        hasil.push([g[g.length - 1][1], g[g.length - 1][0]]);
      }
    });
    return hasil;
  }

  shp(FILE_JALUR)
    .then(function (hasil) {
      const data = Array.isArray(hasil)
        ? { type: 'FeatureCollection', features: hasil.flatMap(h => h.features) }
        : hasil;

      const namaUnik = [...new Set(data.features.map(f => ambilAtribut(f.properties, KOLOM_NAMA_JALUR)))]
        .filter(n => n !== undefined && n !== null)
        .sort((a, b) => Number(a) - Number(b));

      const warnaPerNama = {};
      namaUnik.forEach((nama, i) => { warnaPerNama[nama] = paletJalur[i % paletJalur.length]; });
      warnaPerNamaGlobal = warnaPerNama;

      L.geoJSON(data, {
        style: function (feature) {
          const nama = ambilAtribut(feature.properties, KOLOM_NAMA_JALUR);
          return { color: warnaPerNama[nama] || '#d9721e', weight: BERAT_NORMAL };
        },
        onEachFeature: function (feature, layer) {
          const nama = ambilAtribut(feature.properties, KOLOM_NAMA_JALUR);
          const jarak = ambilAtribut(feature.properties, KOLOM_JARAK_KM);
          const waktu = ambilAtribut(feature.properties, KOLOM_WAKTU);

          layer.bindPopup(
            '<b>Jalur ' + nama + '</b>' +
            (jarak !== undefined ? '<br>Jarak: ' + jarak : '') +
            (waktu !== undefined ? '<br>Waktu: ' + waktu : '')
          );

          if (!layerPerNamaJalur[nama]) layerPerNamaJalur[nama] = [];
          layerPerNamaJalur[nama].push(layer);

          if (!ujungPerNamaJalur[nama]) ujungPerNamaJalur[nama] = [];
          ujungPerNamaJalur[nama].push(...ambilUjung(feature.geometry));
        }
      }).addTo(layerJalur);

      renderLegendaJalur(data.features, namaUnik, warnaPerNama);
      jalurSiap = true;
      cobaSambungkanJalurKeShelter();
    })
    .catch(function (err) {
      console.error('Gagal memuat SHP jalur evakuasi:', err);
      document.getElementById('legendaJalur').innerHTML =
        '<p style="font-size:12px;color:var(--danger)">Gagal memuat data jalur.<br>' +
        '<small>Cek Console (F12) untuk detail. File: ' + FILE_JALUR + '</small></p>';
    });

  function resetSemuaJalur(warnaPerNama) {
    Object.keys(layerPerNamaJalur).forEach(nama => {
      layerPerNamaJalur[nama].forEach(layer => {
        layer.setStyle({ weight: BERAT_NORMAL, color: warnaPerNama[nama] });
      });
    });
    Object.keys(sambungPerNama).forEach(nama => {
      sambungPerNama[nama].setStyle({ weight: 3 });
    });
  }

  function cobaSambungkanJalurKeShelter() {
    if (!TAMPILKAN_SAMBUNGAN_SHP || !shelterSiap || !jalurSiap) return;

    Object.keys(ujungPerNamaJalur).forEach(nama => {
      let terbaik = null;

      ujungPerNamaJalur[nama].forEach(([uLat, uLng]) => {
        shelterFeatures.forEach(f => {
          const [sLng, sLat] = f.geometry.coordinates;
          const d = hitungJarak(uLat, uLng, sLat, sLng);
          if (!terbaik || d < terbaik.d) {
            terbaik = { d, uLat, uLng, sLat, sLng, shelter: f.properties.nama };
          }
        });
      });

      if (!terbaik || terbaik.d < MIN_SAMBUNG_M || terbaik.d > MAKS_SAMBUNG_M) return;

      const garis = L.polyline(
        [[terbaik.uLat, terbaik.uLng], [terbaik.sLat, terbaik.sLng]],
        { color: warnaPerNamaGlobal[nama], weight: 3, dashArray: '2,8', lineCap: 'round' }
      ).bindPopup('<b>Jalur ' + nama + '</b><br>Penghubung ke ' + terbaik.shelter +
                  '<br>±' + Math.round(terbaik.d) + ' m (tidak terdigitasi)');

      garis.addTo(layerJalur);
      sambungPerNama[nama] = garis;
    });
  }

  function renderLegendaJalur(features, namaUnik, warnaPerNama) {
    const wadah = document.getElementById('legendaJalur');
    wadah.innerHTML = '';

    namaUnik.forEach(nama => {
      const wakil = features.find(f => ambilAtribut(f.properties, KOLOM_NAMA_JALUR) === nama);
      const p = wakil ? wakil.properties : {};
      const jarak = ambilAtribut(p, KOLOM_JARAK_KM);
      const waktu = ambilAtribut(p, KOLOM_WAKTU);

      const keterangan = (jarak !== undefined && waktu !== undefined)
        ? `${jarak} · ${waktu}`
        : 'data jarak/waktu tidak ditemukan';

      const baris = document.createElement('div');
      baris.className = 'legenda-jalur-row';
      baris.innerHTML = `
        <span class="legenda-jalur-garis" style="background:${warnaPerNama[nama]}"></span>
        <span class="legenda-jalur-teks"><b>Jalur ${nama}</b><br><span>${keterangan}</span></span>`;

      baris.addEventListener('click', () => {
        const layers = layerPerNamaJalur[nama];
        if (!layers || layers.length === 0) return;

        resetSemuaJalur(warnaPerNama);
        layers.forEach(layer => { layer.setStyle({ weight: BERAT_AKTIF }); layer.bringToFront(); });
        if (sambungPerNama[nama]) sambungPerNama[nama].setStyle({ weight: 5 });

        const grup = L.featureGroup(sambungPerNama[nama] ? [...layers, sambungPerNama[nama]] : layers);
        map.fitBounds(grup.getBounds(), { padding: [50, 50] });

        layers[0].openPopup();

        document.querySelectorAll('.legenda-jalur-row').forEach(el => el.classList.remove('aktif'));
        baris.classList.add('aktif');
      });

      wadah.appendChild(baris);
    });
  }


  // ==========================================================
  // 7. Zona rawan (SHP)
  // ==========================================================
  const layerZona = L.layerGroup().addTo(map);

  shp('data/genangan.zip')
    .then(function (geojson) {
      L.geoJSON(geojson, {
        style: { color:'#0981D1', fillColor:'#0981D1', fillOpacity:0.2, weight:2, dashArray:'6,4' },
        onEachFeature: function (feature, layer) {
          const p = feature.properties || {};
          layer.bindPopup('<b>Zona Rawan Genangan</b>' + (p.nama ? '<br>' + p.nama : ''));
        }
      }).addTo(layerZona);
    })
    .catch(function (err) { console.error('Gagal memuat SHP zona genangan:', err); });


  // ==========================================================
  // 7b. BARU — Batas wilayah (SHP)
  // ==========================================================
  const layerBatas = L.layerGroup().addTo(map);

  // GANTI nama kolom ini sesuai atribut SHP batas wilayah Anda
  // (cek di QGIS/ArcMap: klik kanan layer → Attribute Table)
  const KOLOM_NAMA_WILAYAH = 'WADMKD';

  shp('data/batas_wilayah.zip')
    .then(function (data) {
      L.geoJSON(data, {
        style: {
          color: '#FF0000',   // warna garis batas
          weight: 2,
          dashArray: '5,4',   // putus-putus, konvensi kartografi untuk batas wilayah
          fillOpacity: 0      // tanpa warna isi, supaya tidak menutupi layer lain
        },
        onEachFeature: function (feature, layer) {
          const nama = ambilAtribut(feature.properties, KOLOM_NAMA_WILAYAH);
          if (nama) {
            layer.bindPopup('<b>' + nama + '</b>');
            layer.bindTooltip(nama, { permanent: true, direction: 'center', className: 'label-wilayah' });
          }
        }
      }).addTo(layerBatas);
    })
    .catch(function (err) { console.error('Gagal memuat SHP batas wilayah:', err); });


  // ==========================================================
  // 8. Toggle layer
  // ==========================================================
  function bindToggle(id, layer) {
    document.getElementById(id).addEventListener('change', e => {
      e.target.checked ? map.addLayer(layer) : map.removeLayer(layer);
    });
  }
  bindToggle('lyrShelter', layerShelter);
  bindToggle('lyrRoute',   layerJalur);
  bindToggle('lyrHazard',  layerZona);
  bindToggle('lyrBatas',   layerBatas);   // ← baru


  // ==========================================================
  // 9. Daftar shelter dengan thumbnail foto
  // ==========================================================
  const listEl = document.getElementById('list');

  function renderList(filter = '') {
    const q = filter.toLowerCase();
    const items = shelterFeatures.filter(f => f.properties.nama.toLowerCase().includes(q));

    listEl.innerHTML = items.length ? '' :
      '<p style="font-size:12.5px;color:var(--ink-dim)">Tidak ada shelter yang cocok.</p>';

    items.forEach(f => {
      const p = f.properties;
      const el = document.createElement('div');
      el.className = 'card';
      const fotoTag = p.foto
        ? `<img src="${p.foto}" alt="${p.nama}" onerror="this.style.display='none'">`
        : '';
      el.innerHTML = `${fotoTag}
        <div class="isi">
          <b>${p.nama}</b>
          <div class="meta"><span>${p.kapasitas} jiwa</span><span>${p.elevasi ?? '-'} mdpl</span></div>
          <div style="margin-top:6px"><a class="gmaps-link" target="_blank" rel="noopener">Google Maps</a></div>
        </div>`;

      const tautan = el.querySelector('.gmaps-link');
      const tujuanGm = { lat: f.geometry.coordinates[1], lng: f.geometry.coordinates[0] };
      tautan.href = urlGoogleMaps(posisiUser(), tujuanGm);
      tautan.addEventListener('click', ev => {
        ev.stopPropagation();
        tautan.href = urlGoogleMaps(posisiUser(), tujuanGm);
      });

      el.onclick = () => {
        const [lng, lat] = f.geometry.coordinates;
        map.flyTo([lat, lng], 16, { duration:.8 });
        markerByName[p.nama].openPopup();
      };
      listEl.appendChild(el);
    });
  }
  document.getElementById('search').addEventListener('input', e => renderList(e.target.value));


  // ==========================================================
  // 10. Fungsi bantu
  // ==========================================================
  let userMarker = null, nearLine = null;

  function hitungJarak(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const rad = d => d * Math.PI / 180;
    const dLat = rad(lat2 - lat1);
    const dLng = rad(lng2 - lng1);
    const a = Math.sin(dLat/2) ** 2 +
              Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLng/2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(a));
  }

  function posisiUser() { return userMarker ? userMarker.getLatLng() : null; }

  function urlGoogleMaps(asal, tujuan) {
    let url = 'https://www.google.com/maps/dir/?api=1&travelmode=walking' +
              '&destination=' + tujuan.lat + ',' + tujuan.lng;
    if (asal) url += '&origin=' + asal.lat + ',' + asal.lng;
    return url;
  }

  function decodePolyline(str, presisi) {
    const faktor = Math.pow(10, presisi);
    let index = 0, lat = 0, lng = 0;
    const hasil = [];
    while (index < str.length) {
      let b, shift = 0, hasilBit = 0;
      do { b = str.charCodeAt(index++) - 63; hasilBit |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lat += (hasilBit & 1) ? ~(hasilBit >> 1) : (hasilBit >> 1);
      shift = 0; hasilBit = 0;
      do { b = str.charCodeAt(index++) - 63; hasilBit |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      lng += (hasilBit & 1) ? ~(hasilBit >> 1) : (hasilBit >> 1);
      hasil.push([lat / faktor, lng / faktor]);
    }
    return hasil;
  }

  function formatJarak(m) { return m >= 1000 ? (m / 1000).toFixed(2) + ' km' : Math.round(m) + ' m'; }


  // ==========================================================
  // 11. Rute mengikuti jalan
  // ==========================================================
  const JUMLAH_KANDIDAT = 3;
  const AMBANG_CELAH_M  = 30;

  async function rutePakaiValhalla(dari, ke) {
    const permintaan = {
      locations: [ { lat: dari.lat, lon: dari.lng }, { lat: ke.lat, lon: ke.lng } ],
      costing: 'pedestrian',
      costing_options: { pedestrian: { ignore_access: true } }
    };
    const url = 'https://valhalla1.openstreetmap.de/route?json=' +
                encodeURIComponent(JSON.stringify(permintaan));
    const res = await fetch(url);
    if (!res.ok) throw new Error('Valhalla HTTP ' + res.status);
    const data = await res.json();
    if (!data.trip || !data.trip.legs || !data.trip.legs.length) throw new Error('Valhalla: rute kosong');
    return {
      koordinat: data.trip.legs.flatMap(leg => decodePolyline(leg.shape, 6)),
      jarakM: data.trip.summary.length * 1000,
      waktuDetik: data.trip.summary.time,
      sumber: 'Valhalla (pejalan kaki)'
    };
  }

  async function rutePakaiOSRM(dari, ke) {
    const url = 'https://routing.openstreetmap.de/routed-foot/route/v1/driving/' +
                dari.lng + ',' + dari.lat + ';' + ke.lng + ',' + ke.lat +
                '?overview=full&geometries=geojson';
    const res = await fetch(url);
    if (!res.ok) throw new Error('OSRM HTTP ' + res.status);
    const data = await res.json();
    if (data.code !== 'Ok' || !data.routes.length) throw new Error('OSRM: ' + data.code);
    const r = data.routes[0];
    return {
      koordinat: r.geometry.coordinates.map(c => [c[1], c[0]]),
      jarakM: r.distance,
      waktuDetik: r.duration,
      sumber: 'OSRM (pejalan kaki)'
    };
  }

  async function hitungRuteJalan(dari, ke) {
    try { return await rutePakaiValhalla(dari, ke); }
    catch (e) { console.warn('Valhalla gagal, mencoba OSRM.', e); }
    try { return await rutePakaiOSRM(dari, ke); }
    catch (e) { console.warn('OSRM gagal.', e); }
    return null;
  }


  // ==========================================================
  // 12. Posisi pengguna (GPS atau klik manual di peta)
  // ==========================================================
  const hasilEl = document.getElementById('hasilRute');

  function bersihkanRute() {
    if (nearLine) { map.removeLayer(nearLine); nearLine = null; }
    hasilEl.innerHTML = '';
  }

  function setPosisi(lat, lng, label) {
    if (userMarker) map.removeLayer(userMarker);
    bersihkanRute();
    userMarker = L.circleMarker([lat, lng], { radius:9, color:'#6b3fa0', fillOpacity:.9 })
      .addTo(map).bindPopup(label).openPopup();
  }

  document.getElementById('geoBtn').onclick = () => {
    if (!navigator.geolocation) { alert('Browser tidak mendukung deteksi lokasi.'); return; }
    navigator.geolocation.getCurrentPosition(pos => {
      const { latitude, longitude, accuracy } = pos.coords;
      setPosisi(latitude, longitude, 'Posisi Anda (akurasi ± ' + Math.round(accuracy) + ' m)');
      map.flyTo([latitude, longitude], 15, { duration:.8 });
    }, () => alert('Lokasi tidak bisa dideteksi. Pastikan izin lokasi diaktifkan.'),
    { enableHighAccuracy: true, timeout: 10000 });
  };

  let modeManual = false;
  const manualBtn = document.getElementById('manualBtn');

  function setModeManual(aktif) {
    modeManual = aktif;
    manualBtn.classList.toggle('aktif-mode', aktif);
    manualBtn.textContent = aktif ? 'Klik lokasi di peta... (batal)' : 'Atur Posisi Manual (klik peta)';
    map.getContainer().style.cursor = aktif ? 'crosshair' : '';
  }
  manualBtn.onclick = () => setModeManual(!modeManual);

  map.on('click', e => {
    if (!modeManual) return;
    setPosisi(e.latlng.lat, e.latlng.lng, 'Posisi manual');
    setModeManual(false);
  });


  // ==========================================================
  // 13. Cari shelter terdekat berdasarkan jarak jalan sebenarnya
  // ==========================================================
  function titikUjung(latlng, teks) {
    return L.circleMarker(latlng, { radius:6, color:'#6b3fa0', fillColor:'#fff', fillOpacity:1, weight:3 })
      .bindPopup(teks);
  }

  document.getElementById('nearBtn').onclick = async () => {
    const me = posisiUser();
    if (!me) { alert('Klik "Deteksi Lokasi Saya" atau "Atur Posisi Manual" terlebih dahulu.'); return; }
    if (shelterFeatures.length === 0) { alert('Data shelter belum selesai dimuat.'); return; }

    const kandidat = shelterFeatures.map(f => {
      const [sLng, sLat] = f.geometry.coordinates;
      return { nama: f.properties.nama, lat: sLat, lng: sLng,
               garisLurus: hitungJarak(me.lat, me.lng, sLat, sLng) };
    }).sort((a, b) => a.garisLurus - b.garisLurus).slice(0, JUMLAH_KANDIDAT);

    const tombol = document.getElementById('nearBtn');
    tombol.disabled = true;
    tombol.textContent = 'Menghitung rute...';

    let hasil;
    try {
      hasil = await Promise.all(kandidat.map(async k => ({ k, rute: await hitungRuteJalan(me, k) })));
    } finally {
      tombol.disabled = false;
      tombol.textContent = 'Cari Shelter Terdekat';
    }

    bersihkanRute();
    const berhasil = hasil.filter(h => h.rute).sort((a, b) => a.rute.jarakM - b.rute.jarakM);

    if (berhasil.length === 0) {
      const k = kandidat[0];
      map.flyTo([k.lat, k.lng], 15, { duration:.8 });
      hasilEl.innerHTML =
        '<b>Rute jalan tidak dapat dimuat saat ini.</b><br>' +
        'Shelter terdekat (perkiraan garis lurus): <b>' + k.nama + '</b>, ± ' + formatJarak(k.garisLurus) + '.' +
        '<a class="btn gmaps" target="_blank" rel="noopener" href="' + urlGoogleMaps(me, k) + '">Buka rute di Google Maps</a>';
      return;
    }

    const { k, rute } = berhasil[0];
    const awal  = rute.koordinat[0];
    const akhir = rute.koordinat[rute.koordinat.length - 1];
    const celahAwal  = hitungJarak(me.lat, me.lng, awal[0], awal[1]);
    const celahAkhir = hitungJarak(akhir[0], akhir[1], k.lat, k.lng);

    const lapis = [ L.polyline(rute.koordinat, { color:'#6b3fa0', weight:5 }) ];
    let catatan = '';

    if (celahAwal > AMBANG_CELAH_M) {
      lapis.push(titikUjung(awal, 'Rute dimulai di sini (jalan terdekat dari posisi Anda)'));
      catatan += 'Posisi Anda ± ' + Math.round(celahAwal) + ' m dari jalan yang terbaca di data OSM. ' +
                 'Rute dimulai dari titik putih di peta. ';
    }
    if (celahAkhir > AMBANG_CELAH_M) {
      lapis.push(titikUjung(akhir, 'Rute berakhir di sini (jalan terdekat dari shelter)'));
      catatan += 'Shelter ± ' + Math.round(celahAkhir) + ' m dari ujung jalan terdekat. ';
    }

    nearLine = L.featureGroup(lapis).addTo(map);
    map.fitBounds(nearLine.getBounds(), { padding:[50,50] });

    hasilEl.innerHTML =
      '<b>Shelter terdekat: ' + k.nama + '</b><br>' +
      'Jarak mengikuti jalan: ' + formatJarak(rute.jarakM) + '<br>' +
      'Estimasi: ± ' + Math.ceil(rute.waktuDetik / 60) + ' menit jalan kaki<br>' +
      '<span style="color:var(--ink-dim);font-size:11.5px">Sumber rute: ' + rute.sumber + '</span>' +
      (catatan ? '<div class="catatan">' + catatan + '</div>' : '') +
      '<a class="btn gmaps" target="_blank" rel="noopener" href="' + urlGoogleMaps(me, k) + '">Buka rute di Google Maps</a>';
  };
</script>

</body>
